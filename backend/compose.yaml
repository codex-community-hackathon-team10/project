services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://lunch_mate:${POSTGRES_PASSWORD:-lunch_mate_dev}@postgres:5432/lunch_mate
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lunch_mate
      POSTGRES_USER: lunch_mate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lunch_mate_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunch_mate -d lunch_mate"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
