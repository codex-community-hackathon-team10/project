services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lunch_mate
      POSTGRES_USER: lunch_mate
      POSTGRES_PASSWORD: lunch_mate_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunch_mate -d lunch_mate"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
