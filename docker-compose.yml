services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-true}
      VITE_API_ORIGIN: ${VITE_API_ORIGIN:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
